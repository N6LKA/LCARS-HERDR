<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LCARS">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>LCARS · Claude</title>
<link rel="manifest" href="/static/manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="icon" href="/static/favicon.png">
<link rel="stylesheet" href="/static/vendor/xterm.css">
<link rel="stylesheet" href="/static/lcars.css">
</head>
<body>
<div id="app">
  <div id="elbow"><span id="brand">LCARS</span></div>
  <header id="top">
    <button id="menu-btn" aria-label="Menu">≡</button>
    <div id="tabs" role="tablist"></div>
    <button class="pill orange" id="tab-add" title="New tab">+</button>
    <span id="conn" class="pill gray">LINKING</span>
  </header>

  <aside id="side">
    <div class="rail-head"><span class="rail-title">SPACES</span><button class="rail-add" id="space-add" title="New space">+</button></div>
    <div id="spaces"></div>
    <div class="rail-title" id="agents-title">AGENTS</div>
    <div id="agents"></div>
    <div class="rail-title" id="terms-title" hidden>UNPLACED</div>
    <div id="terms"></div>
    <div class="rail-foot">
      <button class="pill orange" id="new-claude">NEW CLAUDE</button>
      <button class="pill lilac" id="new-shell">NEW SHELL</button>
      <button class="pill gold" id="upload-btn" title="Send an image or document to the focused terminal">SEND FILE</button>
      <button class="pill tan" id="install-btn" hidden>INSTALL APP</button>
      <div class="foot-row"><button class="pill sky" id="keys-btn">KEYS</button><button class="pill violet" id="sound-btn">SOUND ON</button></div>
    </div>
    <input type="file" id="file-input" multiple hidden>
  </aside>

  <main id="main">
    <div id="panes"></div>
    <div id="empty">
      <h2>THIS TAB IS EMPTY</h2>
      <p>Start a Claude session or a shell with the buttons at left, or press <b>Ctrl+Shift+P</b> for every command.</p>
    </div>
    <div id="keybar" aria-label="Touch keys">
      <button data-k="esc">ESC</button><button data-k="tab">TAB</button>
      <button data-k="ctrl-c">^C</button><button data-k="up">▲</button><button data-k="down">▼</button>
      <button data-k="left">◀</button><button data-k="right">▶</button><button data-k="enter">⏎</button>
    </div>
  </main>

  <footer id="foot">
    <span id="f-core">CORE —</span><span id="f-counts"></span><span class="grow"></span>
    <button id="f-hint" title="Command palette">CTRL+SHIFT+P COMMANDS</button><span id="f-clock"></span>
  </footer>
</div>

<dialog id="new-dlg">
  <form method="dialog" id="new-form">
    <h3 id="new-title">NEW SESSION</h3>
    <label>NAME (optional)<input id="new-name" maxlength="32" pattern="[a-z0-9][a-z0-9_.\-]*" placeholder="e.g. homelab"></label>
    <label>FOLDER<input id="new-cwd" value="/root"></label>
    <div class="row"><button class="pill gray" value="cancel" formnovalidate>CANCEL</button><button class="pill orange" value="ok">ENGAGE</button></div>
  </form>
</dialog>

<dialog id="ask-dlg">
  <form method="dialog">
    <h3 id="ask-title">RENAME</h3>
    <label><input id="ask-input" maxlength="40" autocomplete="off"></label>
    <div class="row"><button class="pill gray" value="cancel" formnovalidate>CANCEL</button><button class="pill orange" value="ok">OK</button></div>
  </form>
</dialog>

<dialog id="pal-dlg">
  <input id="pal-input" placeholder="Type a command…" autocomplete="off" spellcheck="false">
  <div id="pal-list"></div>
</dialog>

<dialog id="help-dlg">
  <h3>KEYBOARD SHORTCUTS</h3>
  <div id="help-body"></div>
  <div class="row"><button class="pill orange" id="help-close">CLOSE</button></div>
</dialog>

<div id="toast" role="status"></div>

<script src="/static/vendor/xterm.js"></script>
<script src="/static/vendor/addon-fit.js"></script>
<script src="/static/vendor/addon-web-links.js"></script>
<script src="/static/vendor/addon-unicode11.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
