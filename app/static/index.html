<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LCARS">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>LCARS</title>
<link rel="manifest" href="/static/manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="icon" href="/static/favicon.png">
<link rel="stylesheet" href="/static/vendor/xterm.css">
<link rel="stylesheet" href="/static/lcars.css">
</head>
<body>
<div id="app">
  <div id="sdiv" title="Drag to resize the sidebar · double-click to reset"></div>
  <div id="elbow">
    <button id="search-btn" class="ico" title="Find a space, tab or agent (Ctrl+Shift+K)" aria-label="Find">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/></svg>
    </button>
    <button id="side-btn" class="ico" title="Show or hide the sidebar (Ctrl+Shift+B)" aria-label="Sidebar">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
    </button>
    <span id="brand">LCARS</span>
  </div>

  <header id="top">
    <button id="menu-btn" aria-label="Menu">≡</button>
    <button id="side-show" title="Show the sidebar (Ctrl+Shift+B)" aria-label="Show sidebar"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
    <div id="tabs" role="tablist"></div>
    <button class="pill peach" id="tab-add" title="New tab">+</button>
    <div id="topbar-fill"><span id="top-info"></span><button id="btn-files" class="tbtn" title="Files (Ctrl+Alt+F)">FILES</button><button id="btn-changes" class="tbtn" title="Git changes (Ctrl+Alt+G)">CHANGES</button></div>
    <span id="top-cap"></span>
  </header>

  <aside id="side">
    <section class="sect" id="blk-spaces">
      <div class="rail r-peach"><span id="spaces-count">01</span></div>
      <div class="body">
        <div class="rail-head"><span class="rail-title">SPACES</span><button class="rail-add" id="space-add" title="New space">+</button></div>
        <div id="machine" class="machine"><span class="cap"></span><span class="bar"><span id="machine-name">—</span><i id="machine-dot"></i></span></div>
        <div id="spaces"></div>
      </div>
    </section>

    <section class="sect" id="blk-agents">
      <div class="rail r-lilac"><span id="agents-count">00</span></div>
      <div class="body">
        <div class="rail-title" id="agents-title">AGENTS</div>
        <div id="agents"></div>
        <div class="rail-title" id="terms-title" hidden>UNPLACED</div>
        <div id="terms"></div>
      </div>
    </section>

    <section class="sect" id="blk-foot">
      <div class="rail r-gold"></div>
      <div class="body foot">
        <button class="pill orange" id="new-claude">NEW CLAUDE</button>
        <button class="pill lilac" id="new-shell">NEW SHELL</button>
        <button class="pill peach" id="agents-btn" title="Start another coding agent">MORE AGENTS ▾</button>
        <button class="pill gold" id="upload-btn" title="Send an image or document to the focused terminal">SEND FILE</button>
        <button class="pill tan" id="install-btn" hidden>INSTALL APP</button>
        <div class="foot-row"><button class="pill sky" id="keys-btn">KEYS</button><button class="pill violet" id="sound-btn">SOUND ON</button></div>
      </div>
    </section>
    <input type="file" id="file-input" multiple hidden>
  </aside>

  <main id="main">
    <div id="mainc">
      <div id="panes"></div>
      <div id="empty">
        <h2>THIS TAB IS EMPTY</h2>
        <p>Start a Claude session or a shell with the buttons at left, or press <b>Ctrl+Shift+P</b> for every command.</p>
      </div>
      <div id="keybar" aria-label="Touch keys">
        <button data-k="esc">ESC</button><button data-k="tab">TAB</button>
        <button data-k="ctrl-c">^C</button><button data-k="up">▲</button><button data-k="down">▼</button>
        <button data-k="left">◀</button><button data-k="right">▶</button><button data-k="enter">⏎</button>
      </div>
    </div>
    <div id="pdiv" hidden title="Drag to resize · double-click to reset"></div>
    <aside id="panel" hidden>
      <div id="p-head"><button id="p-back" hidden title="Back to the list">←</button><span id="p-title">FILES</span><span id="p-sub"></span><button id="p-close" title="Close the panel">×</button></div>
      <div id="p-body"></div>
      <div id="p-foot" hidden><input id="c-msg" placeholder="Commit message" maxlength="200" autocomplete="off"><button id="c-btn" class="pill peach small">COMMIT</button><span id="c-note"></span></div>
    </aside>
  </main>

  <footer id="foot">
    <span id="f-core" class="chip gold">LCARS-CORE</span>
    <span id="f-machine" class="chip violet"></span>
    <span id="f-spaces" class="chip lilac"></span>
    <span id="f-agents" class="chip lilac"></span>
    <span class="chip fill"></span>
    <span id="conn" class="chip sky" title="Live connection to the server">LINKING</span>
    <span id="f-clock" class="chip sky"></span>
    <button id="f-hint" class="chip orange" title="Command palette">CTRL+SHIFT+P COMMANDS</button>
  </footer>
</div>

<dialog id="new-dlg">
  <form method="dialog" id="new-form">
    <h3 id="new-title">NEW SESSION</h3>
    <label>NAME (optional)<input id="new-name" maxlength="32" pattern="[a-z0-9][a-z0-9_.\-]*" placeholder="e.g. homelab"></label>
    <label>FOLDER<input id="new-cwd" value="/root"></label>
    <div class="row"><button class="pill gray" value="cancel" formnovalidate>CANCEL</button><button class="pill orange" value="ok">ENGAGE</button></div>
  </form>
</dialog>

<dialog id="ask-dlg">
  <form method="dialog">
    <h3 id="ask-title">RENAME</h3>
    <label><input id="ask-input" maxlength="40" autocomplete="off"></label>
    <div class="row"><button class="pill gray" value="cancel" formnovalidate>CANCEL</button><button class="pill orange" value="ok">OK</button></div>
  </form>
</dialog>

<dialog id="pal-dlg">
  <input id="pal-input" placeholder="Type a command…" autocomplete="off" spellcheck="false">
  <div id="pal-list"></div>
</dialog>

<dialog id="pick-dlg">
  <input id="pick-input" placeholder="Find a space, tab or agent…" autocomplete="off" spellcheck="false">
  <div id="pick-list"></div>
</dialog>

<dialog id="help-dlg">
  <h3>KEYBOARD SHORTCUTS</h3>
  <div id="help-body"></div>
  <div class="row"><button class="pill orange" id="help-close">CLOSE</button></div>
</dialog>

<dialog id="info-dlg">
  <h3 id="info-title"></h3>
  <div id="info-body"></div>
  <div class="row"><button class="pill sky" id="info-shell">OPEN A SHELL</button><button class="pill orange" id="info-close">CLOSE</button></div>
</dialog>
<div id="toast" role="status"></div>

<script src="/static/vendor/xterm.js"></script>
<script src="/static/vendor/addon-fit.js"></script>
<script src="/static/vendor/addon-web-links.js"></script>
<script src="/static/vendor/addon-unicode11.js"></script>
<script src="/static/vendor/addon-webgl.js"></script>
<script src="/static/panel.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
